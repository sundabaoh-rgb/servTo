<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Tanki | Лобби</title>
  <link rel="stylesheet" href="css/lobby.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><rect x='25' y='45' width='50' height='15' fill='%233b82f6'/><circle cx='50' cy='45' r='10' fill='%2322c55e'/><rect x='60' y='40' width='15' height='5' fill='%23fff'/></svg>">

</head>
<body>
<div id="app" class="lobby-app">
  <!-- ВЕРХНЕЕ МЕНЮ -->
  <header class="lobby-topbar">
    <div class="topbar-left">
      <span class="logo">Tanki <span>Online</span></span>
      <span class="logo-sub">Лобби</span>
    </div>

    <div class="topbar-center">
      <button class="topbar-tab active">
        <i class="fas fa-crosshairs"></i>
        Битвы
      </button>
    </div>

    <div class="topbar-right">
      <span id="top-username" class="top-username">
        <i class="fas fa-user"></i> ...
      </span>
      <button id="btn-garage" class="btn btn-garage">
        <i class="fas fa-warehouse"></i>
        Гараж
      </button>
      <button id="btn-logout" class="btn btn-outline btn-logout">
        <i class="fas fa-door-open"></i>
      </button>
    </div>
  </header>

  <!-- ОСНОВНОЕ ЛОББИ: ЧАТ / СПИСОК БИТВ / ИНФА О БИТВЕ -->
  <main class="lobby-layout">
    <!-- ЛЕВАЯ КОЛОНКА: ЧАТ -->
    <section class="panel chat-panel">
      <div class="panel-header">
        <span><i class="fas fa-comments"></i> Чат</span>
      </div>
      <div id="chat-messages" class="chat-messages">
        <!-- сообщения чата -->
      </div>
      <form id="chat-form" class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Написать в чат..." autocomplete="off" />
        <button type="submit" class="btn btn-chat-send">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </section>

    <!-- ЦЕНТР: СПИСОК БИТВ / КОМНАТ -->
    <section class="panel battles-panel">
      <div class="panel-header">
        <div class="panel-header-left">
          <i class="fas fa-list"></i>
          <span>Список битв</span>
        </div>
        <div class="panel-header-actions">
          <button id="btn-refresh-rooms" class="btn btn-small" title="Обновить список">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </div>

      <div class="panel-subheader">
        <span class="panel-caption">Доступные комнаты</span>
        <span id="rooms-summary" class="panel-caption-right"></span>
      </div>

      <div class="rooms-wrapper">
        <table class="rooms-table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Игроки</th>
            <th>Время</th>
            <th>Фонд</th>
          </tr>
          </thead>
          <tbody id="rooms-tbody">
          <!-- сюда рендерятся строки комнат -->
          </tbody>
        </table>
      </div>

      <!-- НИЖНЯЯ ПАНЕЛЬ ПОД КОМНАТАМИ -->
      <div class="battles-footer">
        <!-- слева: создать битву -->
        <button id="btn-open-create-room" class="btn btn-create-room">
          <i class="fas fa-plus-circle"></i>
          <span>Создать битву</span>
        </button>

        <!-- справа: иконки режимов / типов битв (на будущее) -->
        <div class="battle-modes">
          <button class="battle-mode-btn active" data-mode="dm" title="Deathmatch">
            <i class="fas fa-crosshairs"></i>
          </button>
          <button class="battle-mode-btn" data-mode="ctf" title="CTF">
            <i class="fas fa-flag"></i>
          </button>
          <button class="battle-mode-btn" data-mode="cp" title="Control Points">
            <i class="fas fa-bullseye"></i>
          </button>
          <button class="battle-mode-btn" data-mode="parkour" title="Паркур">
            <i class="fas fa-mountain"></i>
          </button>
        </div>
      </div>

      <div id="rooms-msg" class="panel-msg"></div>
    </section>

    <!-- ПРАВАЯ КОЛОНКА: ИНФА О БИТВЕ / СОЗДАНИЕ БИТВЫ -->
    <section class="panel battleinfo-panel">
      <div class="panel-header">
        <span><i class="fas fa-info-circle"></i> Информация о битве</span>
      </div>

      <!-- ВИД "ИНФА О БИТВЕ" -->
      <div id="battleinfo-view-info" class="battleinfo-view active">
        <!-- Превью карты -->
        <div class="room-preview">
          <div class="room-preview-inner">
            <span id="room-preview-name" class="room-preview-name">Выберите битву</span>
            <span id="room-preview-mode" class="room-preview-mode">Режим: DM</span>
          </div>
        </div>

        <!-- Основная инфа -->
        <div class="room-info-main">
          <div class="room-info-row">
            <span class="label">Название:</span>
            <span id="room-info-title" class="value">—</span>
          </div>
          <div class="room-info-row">
            <span class="label">Игроки:</span>
            <span id="room-info-players" class="value">0/0</span>
          </div>
          <div class="room-info-row">
            <span class="label">Время:</span>
            <span id="room-info-time" class="value">—</span>
          </div>
          <div class="room-info-row">
            <span class="label">Награда:</span>
            <span id="room-info-reward" class="value">—</span>
          </div>
        </div>

        <!-- Игроки в комнате -->
        <div class="room-players-box">
          <div class="room-players-header">
            <span><i class="fas fa-users"></i> Участники</span>
          </div>
          <ul id="room-players-list" class="room-players-list">
            <!-- список игроков -->
          </ul>
        </div>

        <!-- Кнопка "Играть" / "Покинуть" -->
        <div class="battleinfo-footer">
          <button id="btn-join-leave" class="btn btn-green full-width">
            <i class="fas fa-play"></i>
            <span>ВСТУПИТЬ В БИТВУ</span>
          </button>
        </div>
      </div>

      <!-- ВИД "СОЗДАНИЕ БИТВЫ" -->
      <!-- ВИД "СОЗДАНИЕ БИТВЫ" -->
<div id="battleinfo-view-create" class="battleinfo-view hidden">
  <div class="create-room-header">
    <h3>Создание битвы</h3>
    <p>Настрой параметры комнаты и запусти бой.</p>
  </div>

  <form id="create-room-form" class="create-room-form">
    <div class="form-row">
      <label for="create-room-name">Название битвы</label>
      <input id="create-room-name" name="name" type="text"
             placeholder="Например: DM на мосту" required minlength="3" maxlength="32" />
    </div>

    <div class="form-row">
      <label for="create-room-mode">Режим (пока только в UI)</label>
      <select id="create-room-mode" name="mode">
        <option value="dm">Deathmatch</option>
        <option value="ctf">Захват флага</option>
        <option value="cp">Контроль точек</option>
        <option value="parkour">Паркур</option>
      </select>
    </div>

    <div class="form-row form-row-inline">
      <div class="form-col">
        <label for="create-room-max-players">Игроков, макс</label>
        <input id="create-room-max-players" name="max_players" type="number"
               min="2" max="16" value="8" />
      </div>
      <div class="form-col">
        <label for="create-room-duration">Время (мин)</label>
        <input id="create-room-duration" name="duration_minutes" type="number"
               min="5" max="60" value="15" />
      </div>
    </div>

    <div class="form-row form-row-inline">
      <div class="form-col">
        <label for="create-room-gpk">Награда за килл</label>
        <input id="create-room-gpk" name="gold_per_kill" type="number" min="0" value="10" />
      </div>
      <div class="form-col">
        <label for="create-room-fund-mod">Модификатор фонда (x)</label>
        <input id="create-room-fund-mod" name="fund_modifier" type="number" step="0.1" min="0" value="1" />
      </div>
    </div>

    <div class="form-row form-row-buttons">
      <button type="submit" id="btn-create-room" class="btn btn-green full-width">
        <i class="fas fa-check"></i>
        <span>Создать битву</span>
      </button>
      <button type="button" id="btn-cancel-create-room" class="btn btn-outline full-width">
        <i class="fas fa-times"></i>
        <span>Отмена</span>
      </button>
    </div>
  </form>
</div>


      <div id="battle-msg" class="panel-msg"></div>
    </section>
  </main>
</div>

<script src="js/lobby.js"></script>
</body>
</html>
